name: Linux build and security checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GATSBY_TELEMETRY_DISABLED: '1'
      CI: 'true'
      NODE_OPTIONS: --openssl-legacy-provider
      HUSKY_SKIP_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - name: Verify hosting and CI runtime match
        run: |
          node <<'JS'
          const assert = require('assert');
          const config = require('fs').readFileSync('netlify.toml', 'utf8');
          assert(config.includes('NODE_VERSION = "20.18.1"'));
          assert(config.includes('NODE_OPTIONS = "--openssl-legacy-provider"'));
          assert(!config.includes('[context.deploy-preview.environment]'), 'Preview must use the same runtime as production');
          assert.equal(process.version, 'v20.18.1');
          JS
      - name: Install Yarn and frozen dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
      - name: Font and patched dependency checks
        run: |
          yarn test:font-merge
          node scripts/test-tooling-patches.js
          node <<'JS'
          const assert = require('assert');
          const path = require('path');
          const forge = require('node-forge');
          assert.equal(require('node-forge/package.json').version, '1.4.3');
          for (const parent of ['selfsigned', 'google-p12-pem']) {
            const resolved = require.resolve('node-forge/package.json', {paths:[path.dirname(require.resolve(parent))]});
            assert.equal(require(resolved).version, '1.4.3');
          }
          const pems = require('selfsigned').generate([{name:'commonName',value:'localhost'}], {days:1,keySize:2048,algorithm:'sha256'});
          const cert = forge.pki.certificateFromPem(pems.cert);
          assert(cert.verify(cert));
          const client = forge.tls.createConnection({server:false, tlsDataReady:()=>{}, closed:()=>{}, error:()=>{}});
          client.handshake();
          client.process(forge.util.hexToBytes('15030100020100'));
          client.process(forge.util.hexToBytes('160301000402000000'));
          console.log('Patched Forge and selfsigned smoke test passed');
          JS
          yarn list --pattern node-forge
      - name: Build Gatsby without deploying
        run: yarn gatsby-build
